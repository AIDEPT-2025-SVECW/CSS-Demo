<!DOCTYPE html>
<html>
  <head>
    <title>Internal CSS Demo</title>

    <!-- External CSS first -->
    <link rel="stylesheet" href="css/styles.css" />

    <!-- Internal CSS comes AFTER external CSS -->
    <style>
      /* Same selector as external */
      div {
        background-color: purple;
      }
    </style>
  </head>
  <body>
    <h2>2️⃣ Internal CSS Overrides External CSS</h2>

    <div>Background is PURPLE because internal CSS is written later</div>
  </body>
</html>
