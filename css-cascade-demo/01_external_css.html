<!DOCTYPE html>
<html>
  <head>
    <title>External CSS Demo</title>

    <!-- External CSS is linked here -->
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <h2>1️⃣ External CSS Only</h2>

    <!-- Styled only by external CSS -->
    <div>This is a DIV (element selector applies)</div>

    <div class="box">This DIV has a CLASS → class overrides element</div>

    <div id="mainBox">This DIV has an ID → ID overrides class & element</div>
  </body>
</html>
